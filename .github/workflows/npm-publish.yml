name: Build, Test & Publish

on:
    push:
        branches: [main, master]
        tags: ['v*']
    pull_request:
    workflow_dispatch:

# Aynı anda iki sürüm yayınlanmasın.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
    build:
        name: Build & verify
        runs-on: ubuntu-latest
        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                node: ['18.x', '20.x', '22.x']

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Test
              run: npm run test:coverage

            # Derler ve ESM/CJS çıktısının gerçekten yüklenebildiğini doğrular.
            - name: Build and verify package
              run: npm run verify:package

    publish:
        name: Publish to npm
        # Yalnızca sürüm etiketi varsa yayınlar.
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest

        permissions:
            contents: read
            # npm trusted publishing (OIDC) için gerekli.
            # npmjs.com -> Trusted Publishers altında bu repo + workflow
            # eşleştirilmelidir; NPM_TOKEN gibi bir secret kullanılmaz.
            id-token: write

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: npm

            - name: Install
              run: npm ci

            # Trusted publishing npm >= 11.5.1 gerektiriyor; Node 22 varsayılan
            # olarak npm 10.x ile geliyor.
            - name: Upgrade npm for trusted publishing
              run: |
                  npm install -g npm@latest
                  node -e "const [maj,min,pat]=require('npm/package.json').version.split('.').map(Number);if(maj<11||(maj===11&&min<5)||(maj===11&&min===5&&pat<1)){throw new Error('npm >= 11.5.1 gerekli')}console.log('npm',require('npm/package.json').version)"

            # Sürümü etiketten türet; package.json ile elle eşleşmesin.
            - name: Set version from tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(p.version!==process.argv[1]){p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,'\t')+'\n')}" "$VERSION"
                  node -e "console.log('publishing version:', require('./package.json').version)"

            - name: Verify before publish
              run: npm run ci

            - name: Publish (trusted publishing / OIDC)
              run: npm publish --access public
